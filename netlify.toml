[build]
  publish = "."

[build.processing]
  skip_processing = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200
[[redirects]]
  from = "/online"
  to = "/online.html"
  status = 200
[[redirects]]
  from = "/giving"
  to = "/giving.html"
  status = 200
[[redirects]]
  from = "/community"
  to = "/community.html"
  status = 200
[[redirects]]
  from = "/leadership"
  to = "/leadership.html"
  status = 200
[[redirects]]
  from = "/thanks"
  to = "/thanks.html"
  status = 200
